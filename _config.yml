# Site URL (used for canonical links, the sitemap and structured data)
url: https://receipttrackerapp.com

# Exclude these files from the published site
exclude:
  - LICENSE
  - README.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - receipttrackerapp

collections:
  pages:
    output: true
    permalink: /:path/

markdown: kramdown
include: [".well-known"]

plugins:
  - jekyll-redirect-from
