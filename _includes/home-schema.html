    {

      "name": "Receiptly",

      "featureList": [
        "Smart receipt scanning",
        "Batch receipt scanning",
        "Gmail receipt import",
        "Expense and reimbursement tracking",

        "Multi-currency travel expenses",
        "Apple Shortcuts automation",
        "Optional iCloud sync"
      ],
      "author": { "@id": "https://receipttrackerapp.com/#organization" }
    },
    {
      "@type": "SoftwareApplication",
      "@id": "https://receipttrackerapp.com/#app-android",
      "name": "Receiptly",
      "alternateName": "Receiptly: Receipt Scanner",
      "description": "A receipt scanner and expense tracker for Android with on-device OCR, optional Smart Scan, warranty tracking, reports, and PDF, CSV and Excel export. Receipts stay on the device. No iCloud or iPhone sync.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Android 8.0 or later",
      "url": "https://receipttrackerapp.com/",
      "installUrl": "https://play.google.com/store/apps/details?id=com.karmafyapps.receiptly",
      "downloadUrl": "https://play.google.com/store/apps/details?id=com.karmafyapps.receiptly",
      "image": "https://receipttrackerapp.com/images/2026/receiptly-app-icon.png",
      "isAccessibleForFree": true,

        "On-device receipt scanning",
        "Optional Smart Scan",

      ],
      "author": { "@id": "https://receipttrackerapp.com/#organization" }
    },
    {
      "@type": "Organization",
      "@id": "https://receipttrackerapp.com/#organization",

      ]
    },
    {
      "@type": "WebSite",
      "@id": "https://receipttrackerapp.com/#website",
      "url": "https://receipttrackerapp.com/",
      "name": "Receiptly",
      "inLanguage": "en",
      "publisher": { "@id": "https://receipttrackerapp.com/#organization" }
    },
    {
      "@type": "FAQPage",
      "@id": "https://receipttrackerapp.com/#faq",
      "mainEntity": [
        {%- assign home_faqs = site.data.faqs | where: "home", true -%}
        {%- for faq in home_faqs %}
        {
          "@type": "Question",
          "name": {{ faq.question | jsonify }},
          "acceptedAnswer": { "@type": "Answer", "text": {{ faq.answer | markdownify | strip_html | strip | jsonify }} }
        }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
  ]
