<header class="site-header" data-header>
    <nav class="nav-shell" aria-label="Primary navigation">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Receiptly home">
            <img src="{{ '/images/2026/receiptly-app-icon.png' | relative_url }}" width="44" height="44" alt="" class="brand-icon">
            <span>Receiptly</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-menu" data-menu-toggle>
            <span class="sr-only">Open navigation</span>
            <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
        </button>
        <div class="nav-menu" id="primary-menu" data-menu>
            {%- for link in site.data.navigation.header %}
            <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
            {%- endfor %}
            <a class="nav-cta" href="{{ '/#download' | relative_url }}">Download</a>
        </div>
    </nav>
</header>
